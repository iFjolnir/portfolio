<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Faina Iasen — Graphic designer</title>
  <meta name="description" content="Portfolio of Faina Iasen, graphic designer based in Busan. Coming soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='5' y='5' width='6' height='6' fill='%23121212'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
:root{--ink:#121212;--grey:#737373;--rule:#e3e3e3;--paper:#fff;--pad:20px;
--font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.45;letter-spacing:-.03em;-webkit-font-smoothing:antialiased}
:lang(ko){letter-spacing:-.01em}
h1,p,ul{margin:0;padding:0}ul{list-style:none}h1{font-weight:500}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1em;height:44px;padding:0 var(--pad);border-bottom:1px solid var(--rule);font-size:14px}
.bar b{font-weight:600}
.grey{color:var(--grey)}
.time{font-variant-numeric:tabular-nums}
main{flex:1;width:100%;max-width:760px;padding:96px var(--pad) 0}
.display{font-size:56px;line-height:1;letter-spacing:-.05em}
.lead{font-size:26px;line-height:1.12;letter-spacing:-.04em;max-width:30em}
footer{display:flex;justify-content:space-between;gap:1em;padding:14px var(--pad) 18px;border-top:1px solid var(--rule);font-size:12px;color:var(--grey);margin-top:96px}
@media (max-width:809px){:root{--pad:16px}main{padding-top:48px}.display{font-size:40px}.lead{font-size:21px}}

.links{margin-top:56px;border-top:1px solid var(--rule)}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:flex;justify-content:space-between;gap:1em;padding:6px 0 7px}
.links a span:last-child{color:var(--grey)}
.links a:hover{text-decoration:none}
.links a:hover span:first-child{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
  </style>
</head>
<body>
  <header class="bar">
    <b>Faina Iasen</b>
    <span class="time grey" data-clock>Busan</span>
  </header>

  <main>
    <h1 class="display">Under<br>construction.</h1>
    <!-- EDIT: the grey half is inside <span class="grey"> -->
    <p class="lead" style="margin-top:40px">A graphic designer based in Busan, building this site as we speak. <span class="grey">The full portfolio is on its way.</span></p>

    <ul class="links">
      <!-- EDIT: change the email if it's different, or add a line for Instagram/Behance -->
      <li><a href="mailto:hello@fainaiasen.com"><span>Email</span><span>hello@fainaiasen.com</span></a></li>
      <li><a href="https://apps.fainaiasen.com/"><span>Web App Collection</span><span>apps.fainaiasen.com</span></a></li>
    </ul>
  </main>

  <footer>
    <span>&copy; 2026 Faina Iasen</span>
    <span>Busan, South Korea</span>
  </footer>

  <script>
  (function () {
    var el = document.querySelector("[data-clock]");
    if (!el || !window.Intl) return;
    var f = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Seoul", hour: "numeric", minute: "2-digit", hour12: true });
    function tick() { el.textContent = "Busan, " + f.format(new Date()).replace(/\s?([ap])\.?m\.?/i, function (_, a) { return " " + a.toLowerCase() + "m"; }); }
    tick(); setInterval(tick, 15000);
  })();
  </script>
</body>
</html>
