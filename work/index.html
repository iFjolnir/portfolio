<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Graphic designer and design educator based in Busan.">
  <meta property="og:title" content="Work — Faina Iasen">
  <meta property="og:description" content="Graphic designer and design educator based in Busan.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='5' y='5' width='6' height='6' fill='%23121212'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard-std/dist/web/variable/pretendardvariable-std-dynamic-subset.css">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root="../" data-page="work">
  <header class="bar">
    <a class="bar__name" href="../">Faina Iasen</a>
    <nav class="bar__nav" aria-label="Main">
      <a href="../" data-nav="home">Home</a>
      <a href="../work/" data-nav="work">Work</a>
      <a href="../info/" data-nav="info">Info</a>
    </nav>
    <div class="bar__end">
      <p class="bar__time" data-clock>Busan</p>
      <a class="bar__cta" href="mailto:hello@fainaiasen.com">Say hello</a>
    </div>
  </header>

  <div class="frame">

    <aside class="col col--side col--left">
      <h1 class="t-display">Work.</h1>
      <nav aria-label="Filter by discipline">
        <ul class="lines lines--grey t-body" data-render="filters"></ul>
      </nav>
    </aside>

    <main class="col col--mid">
      <div class="section__head">
        <h2 class="t-head" data-filter-label>All work</h2>
      </div>
      <ul class="work-grid" data-render="grid"></ul>
      <noscript><p class="t-body">Turn on JavaScript to see the project list.</p></noscript>

      <footer class="sign-off">
        <a class="sign-off__link t-statement" href="mailto:hello@fainaiasen.com">Say hello.</a>
        <div class="sign-off__base t-meta">
          <span>&copy; 2026 Faina Iasen</span>
          <span>Busan, South Korea</span>
        </div>
      </footer>
    </main>

    <aside class="col col--side col--right">
      <div>
        <div class="section__head" style="justify-content:flex-end; gap:0.5em">
          <span class="t-small">Index</span><span class="t-meta" data-count="all"></span>
        </div>
        <ul class="lines lines--grey t-small" data-render="index"></ul>
      </div>
      <p class="t-meta">Click a discipline on the left to narrow the list.</p>
    </aside>

  </div>

  <script src="../assets/site.js"></script>
</body>
</html>
